name: CI

on:
  pull_request:
  push:
    branches: [main]

# Une nouvelle exécution sur la même branche annule la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore TaskFlow.slnx

      - name: Build (warnings = erreurs)
        run: dotnet build TaskFlow.slnx --no-restore -c Release

      - name: Tests (unitaires + architecture)
        run: dotnet test --solution TaskFlow.slnx --no-build -c Release

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/taskflow-ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/taskflow-ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests (Vitest)
        run: npm test -- --watch=false

      - name: Build production
        run: npm run build
